<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #f5f7fa;
    --ink: #1c2430;
    --soft: #5b6676;
    --blue: #7ea3c6;
    --blue-ink: #4f7ea6;
    --on-blue: #14202e;
    --on-blue-soft: #2e4258;
    --display: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --mono: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 17px/1.6 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--blue); color: var(--on-blue); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--blue-ink); outline-offset: 4px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding-inline: clamp(20px, 4vw, 48px); }
  .label {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--soft); margin: 0;
  }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; padding-block: 22px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; text-decoration: none; }
  .top nav { display: flex; gap: 24px; }
  .top nav a {
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--soft); text-decoration: none; transition: color 160ms ease;
  }
  .top nav a:hover { color: var(--ink); }

  .hero { padding-block: clamp(40px, 8vh, 96px) clamp(48px, 7vw, 96px); }
  h1 {
    margin: 18px 0 0;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(2.75rem, 7.4vw, 6.75rem);
    line-height: 0.98; letter-spacing: -0.035em;
    max-width: 12ch;
  }
  .line { display: block; overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
  .line > span { display: block; transform: translateY(110%); animation: rise 0.8s var(--ease) forwards; }
  .line:nth-child(2) > span { animation-delay: 0.08s; }
  .az { color: var(--blue-ink); }
  .lede {
    max-width: 32em; margin: 32px 0 0;
    font-size: clamp(1.05rem, 1.35vw, 1.2rem); line-height: 1.55;
    opacity: 0; animation: fade 0.7s ease 0.4s forwards;
  }
  .lede a, .text a { color: var(--blue-ink); text-decoration: underline; text-underline-offset: 0.15em; text-decoration-thickness: 1.5px; transition: color 160ms ease; }
  .lede a:hover, .text a:hover { color: var(--ink); }

  .row { display: grid; grid-template-columns: 1fr; gap: 14px 40px; padding-block: clamp(36px, 5.5vw, 76px); border-top: 1px solid rgba(28, 36, 48, 0.1); }
  @media (min-width: 820px) { .row { grid-template-columns: 200px 1fr; } }
  .row .label { padding-top: 0.45em; }
  .text p { margin: 0; max-width: 34em; }
  .text p + p { margin-top: 1.1em; }

  .close { background: var(--blue); color: var(--on-blue); margin-top: clamp(24px, 4vw, 48px); padding-block: clamp(56px, 8vw, 112px) 32px; }
  .close .label { color: var(--on-blue-soft); }
  .mail {
    display: inline-block; margin-top: 18px; max-width: 100%;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1.6rem, 4.6vw, 4.25rem); line-height: 1.05; letter-spacing: -0.03em;
    color: var(--on-blue); text-decoration: none;
    border-bottom: 0.06em solid var(--on-blue); padding-bottom: 0.06em;
    transition: opacity 160ms ease;
  }
  .mail:hover { opacity: 0.72; }
  .close .note { margin: 28px 0 0; max-width: 34em; color: var(--on-blue-soft); font-size: 16px; }
  .foot {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 32px;
    margin-top: clamp(48px, 6vw, 80px); padding-bottom: max(0px, env(safe-area-inset-bottom));
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-blue-soft);
  }

  @keyframes rise { to { transform: none; } }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .line > span { animation: none; transform: none; }
    .lede { animation: none; opacity: 1; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="top wrap">
  <a class="brand" href="/">VSVS LLC</a>
  <nav aria-label="Site">
    <a href="/#about">About</a>
    <a href="/#tenants">Tenants</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>
<main>
  <section class="hero wrap">
    <p class="label">Page not found</p>
    <h1><span class="line"><span>Nothing at</span></span><span class="line"><span class="az">this address.</span></span></h1>
    <p class="lede">The page you asked for is not here. Go back to <a href="/">vsvsllc.com</a>, or write to <a href="mailto:hello@vsvsllc.com">hello@vsvsllc.com</a>.</p>
  </section>
</main>
</body>
</html>
